<h1>Meus Chamados</h1>

<a href="{% url 'criar_chamado' %}">
    <button type="button">Adicionar chamado</button>
</a>

<hr>

{% for chamado in chamados %}

    <h3>{{ chamado.titulo }}</h3>

    <p>{{ chamado.descricao }}</p>

    <p>Prioridade: {{ chamado.get_prioridade_display }}</p>

    <p>Status: {{ chamado.get_status_display }}</p>

    <a href="{% url 'detalhe_chamado' chamado.pk %}">
        Ver detalhes
    </a>

    <hr>

{% empty %}

    <p>Você ainda não abriu nenhum chamado.</p>

{% endfor %}
