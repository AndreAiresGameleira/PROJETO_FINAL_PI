{# Campos usados por criar_usu.html e editar_usu.html #}
{# Na edição, a view envia "usuario" e os campos já vêm preenchidos #}
<div class="form-grid">

    <div class="field">
        <label for="first_name">Nome <span class="req">*</span></label>
        <input class="input" type="text" id="first_name" name="first_name"
               value="{{ usuario.first_name }}" placeholder="Ex: André" required>
    </div>

    <div class="field">
        <label for="last_name">Sobrenome</label>
        <input class="input" type="text" id="last_name" name="last_name"
               value="{{ usuario.last_name }}" placeholder="Ex: Felipe">
    </div>

    <div class="field">
        <label for="username">Usuário <span class="req">*</span></label>
        <input class="input" type="text" id="username" name="username"
               value="{{ usuario.username }}" placeholder="Ex: andre.felipe"
               autocomplete="off" required>
        <p class="hint">É com ele que a pessoa faz login.</p>
    </div>

    <div class="field">
        <label for="email">E-mail <span class="req">*</span></label>
        <input class="input" type="email" id="email" name="email"
               value="{{ usuario.email }}" placeholder="Ex: andre@empresa.com" required>
    </div>

    <div class="field">
        <label for="password">Senha {% if senha_obrigatoria %}<span class="req">*</span>{% endif %}</label>
        <input class="input" type="password" id="password" name="password"
               autocomplete="new-password" {% if senha_obrigatoria %}required{% endif %}>
        {% if not senha_obrigatoria %}
            <p class="hint">Deixe em branco para manter a senha atual.</p>
        {% endif %}
    </div>

    <div class="field">
        <label for="tipo">Perfil <span class="req">*</span></label>
        <select class="input" id="tipo" name="tipo" required>
            <option value="usuario" {% if usuario.perfil.tipo == 'usuario' %}selected{% endif %}>Usuário</option>
            <option value="tecnico" {% if usuario.perfil.tipo == 'tecnico' %}selected{% endif %}>Técnico</option>
            <option value="admin" {% if usuario.perfil.tipo == 'admin' %}selected{% endif %}>Administrador</option>
        </select>
    </div>

</div>

<div class="form-actions">
    <a href="{% url 'lista_usu' %}" class="btn btn-outline">Cancelar</a>
    <button type="submit" class="btn btn-primary">{{ botao }}</button>
</div>
