{% extends 'base.html' %}

{% block title %}Novo usuário{% endblock %}

{% block content %}
<a href="{% url 'lista_usu' %}" class="back-link">
    <svg class="icon"><use href="#i-arrow-left"/></svg> Voltar
</a>

<div class="page-head">
    <div>
        <h1>Novo usuário</h1>
        <p class="subtitle">Preencha os dados para criar uma nova conta.</p>
    </div>
</div>

<div class="card form-card">
    <form method="post">
        {% csrf_token %}
        {% include 'perfil/forms_usu.html' with botao='Criar usuário' senha_obrigatoria=True %}
    </form>
</div>
{% endblock %}
