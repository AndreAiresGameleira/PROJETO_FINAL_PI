{% extends 'base.html' %}
{# Base do perfil Solicitante: so aparecem aqui os links que esse perfil pode usar #}

{% block usuario %}{{ user.get_username|default:"Solicitante" }}{% endblock %}

{% block menu %}
    <a href="{% url 'lista_chamados' %}" {% if request.resolver_match.url_name == 'lista_chamados' %}class="ativo"{% endif %}>
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>
        Meus chamados
    </a>
    <a href="{% url 'criar_chamado' %}" {% if request.resolver_match.url_name == 'criar_chamado' %}class="ativo"{% endif %}>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        Novo chamado
    </a>
{% endblock %}
